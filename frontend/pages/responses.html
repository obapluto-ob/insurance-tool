<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responses – Dona's Tool</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script>
  requireAuth();
  renderNav("Responses");

  async function load() {
    let data;
    try {
      const res = await apiFetch("/api/responses");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (err) {
      console.error("[responses] load failed:", err);
      document.getElementById("page-content").innerHTML = `<div class="empty" style="color:red">Failed to load responses. Check console (F12).</div>`;
      return;
    }

    const cards = data.length ? data.map(r => `
      <div class="response-card">
        <div class="response-header">
          <span>👤 <strong>${r.name || "Unknown"}</strong></span>
          <span>✉️ ${r.email}</span>
          <span class="response-date">📅 ${r.date || "—"}</span>
        </div>
        <div class="response-body">${r.text || "No content."}</div>
      </div>
    `).join("") : `<div class="empty-state"><p>📭 No responses yet.</p><p>Click <strong>Check Replies</strong> to fetch new replies from Gmail.</p></div>`;

    document.getElementById("page-content").innerHTML = `
      <div class="page-header">
        <h1>Responses <span class="badge">${data.length}</span></h1>
        <button class="btn btn-secondary" onclick="checkReplies()">📬 Refresh Replies</button>
      </div>
      <div class="responses-list">${cards}</div>
    `;
  }

  async function checkReplies() {
    document.getElementById("status-bar").textContent = "📬 Checking replies...";
    await apiFetch("/api/check_replies");
    setTimeout(load, 5000);
  }

  load();
</script>
</body>
</html>
