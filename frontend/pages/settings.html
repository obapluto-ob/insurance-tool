<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings – Dona's Tool</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script>
  requireAuth();
  renderNav("Settings");

  async function load() {
    const res = await apiFetch("/api/settings");
    const d = await res.json();

    document.getElementById("page-content").innerHTML = `
      <div class="page-header"><h1>⚙️ Settings</h1></div>
      <div class="settings-wrap">
        <div id="msg"></div>
        <div class="settings-section">
          <h3>🌐 Portal Credentials</h3>
          <p class="settings-hint">Used to log into planetaltig.com and sync your leads.</p>
          <div class="field-group">
            <label>Portal Username</label>
            <input type="text" value="${d.PORTAL_USERNAME || ""}" disabled/>
          </div>
          <div class="field-group">
            <label>Portal Password</label>
            <input type="password" id="portal_password" placeholder="Enter new portal password"/>
          </div>
        </div>
        <div class="settings-section">
          <h3>📧 Gmail Settings</h3>
          <p class="settings-hint">Requires a Gmail App Password to send emails and check replies.</p>
          <div class="field-group">
            <label>Gmail Address</label>
            <input type="text" value="${d.GMAIL_ADDRESS || ""}" disabled/>
          </div>
          <div class="field-group">
            <label>Gmail App Password</label>
            <input type="password" id="gmail_app_password" placeholder="Enter 16-character app password"/>
            <span class="field-note">Get it at <a href="https://myaccount.google.com/apppasswords" target="_blank">myaccount.google.com/apppasswords</a></span>
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">💾 Save Settings</button>
      </div>
    `;
  }

  async function saveSettings() {
    const res = await apiFetch("/api/settings", {
      method: "POST",
      body: JSON.stringify({
        portal_password: document.getElementById("portal_password").value,
        gmail_app_password: document.getElementById("gmail_app_password").value
      })
    });
    const d = await res.json();
    const msg = document.getElementById("msg");
    msg.className = d.ok ? "alert-success" : "alert";
    msg.textContent = d.ok ? "✅ Settings saved!" : "❌ Failed to save.";
    msg.style.display = "block";
  }

  load();
</script>
</body>
</html>
