<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings – Dona's Tool</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script>
  requireAuth();
  renderNav("Settings");

  async function load() {
    const [sRes, sigRes, tplRes] = await Promise.all([
      apiFetch("/api/settings"),
      apiFetch("/api/signature"),
      apiFetch("/api/templates"),
    ]);
    const s = await sRes.json();
    const sig = await sigRes.json();
    const tpl = await tplRes.json();

    document.getElementById("page-content").innerHTML = `
      <div class="page-header"><h1>Settings</h1></div>
      <div class="settings-wrap">
        <div id="msg"></div>

        <div class="settings-section">
          <h3>Portal Session Cookie</h3>
          <p class="settings-hint">Paste your session cookie here to sync without needing a password. Bypasses reCAPTCHA completely.</p>
          <div class="field-group">
            <label>Session Cookie ${s.has_session_cookie ? '<span class="saved-badge">Saved</span>' : ''}</label>
            <div class="pass-wrap">
              <input type="password" id="session_cookie" value="${s.has_session_cookie ? '••••••••••••••••' : ''}" placeholder="Paste cookie value here"/>
              <button class="eye-btn" onclick="togglePass('session_cookie', this)">Show</button>
            </div>
            <span class="field-note">How to get it: Log into planetaltig.com in Chrome → F12 → Application → Cookies → www.planetaltig.com → find <strong>.AspNet.ApplicationCookie</strong> or <strong>.ASPXAUTH</strong> → copy the Value</span>
          </div>
          <button class="btn btn-primary" id="cookie-btn" onclick="saveCookie()">Save Cookie</button>
        </div>

        <div class="settings-section">
          <h3>Portal Credentials</h3>
          <p class="settings-hint">Used to log into planetaltig.com and sync leads.</p>
          <div class="field-group">
            <label>Portal Username</label>
            <input type="text" value="${s.PORTAL_USERNAME || ''}" disabled/>
          </div>
          <div class="field-group">
            <label>Portal Password ${s.has_portal_password ? '<span class="saved-badge">Saved</span>' : ''}</label>
            <div class="pass-wrap">
              <input type="password" id="portal_password" value="${s.has_portal_password ? '••••••••••••' : ''}"/>
              <button class="eye-btn" onclick="togglePass('portal_password', this)">Show</button>
            </div>
          </div>
          <div class="field-group">
            <label>Gmail Address</label>
            <input type="text" value="${s.GMAIL_ADDRESS || ''}" disabled/>
          </div>
          <div class="field-group">
            <label>Gmail App Password ${s.has_gmail_password ? '<span class="saved-badge">Saved</span>' : ''}</label>
            <div class="pass-wrap">
              <input type="password" id="gmail_app_password" value="${s.has_gmail_password ? '••••••••••••••••' : ''}" placeholder="16-character app password"/>
              <button class="eye-btn" onclick="togglePass('gmail_app_password', this)">Show</button>
            </div>
            <span class="field-note">Get it at <a href="https://myaccount.google.com/apppasswords" target="_blank">myaccount.google.com/apppasswords</a></span>
          </div>
          <button class="btn btn-primary" id="cred-btn" onclick="saveCredentials()">Save Credentials</button>
        </div>

        <div class="settings-section">
          <h3>Your Signature</h3>
          <p class="settings-hint">Appears at the bottom of every email sent.</p>
          <div class="field-group">
            <label>Full Name</label>
            <input type="text" id="sig_name" value="${sig.sig_name || ''}"/>
          </div>
          <div class="field-group">
            <label>Title</label>
            <input type="text" id="sig_title" value="${sig.sig_title || ''}"/>
          </div>
          <div class="field-group">
            <label>Phone Number</label>
            <input type="text" id="sig_phone" value="${sig.sig_phone || ''}" placeholder="e.g. (555) 123-4567"/>
          </div>
          <button class="btn btn-primary" id="sig-btn" onclick="saveSignature()">Save Signature</button>
        </div>

        <div class="settings-section">
          <h3>Email Templates</h3>
          <p class="settings-hint">Edit the subject and body for each email template. Use {name} for lead name, {signature} for your signature.</p>
          <div class="tpl-tabs">
            ${Object.keys(tpl).map((name, i) => `<button class="tpl-tab ${i===0?'active':''}" onclick="switchTab('${name}', this)">${name}</button>`).join("")}
          </div>
          ${Object.entries(tpl).map(([name, t], i) => `
            <div class="tpl-panel ${i===0?'':'hidden'}" id="tpl-${name.replace(/ /g,'_')}">
              <div class="field-group">
                <label>Subject</label>
                <input type="text" id="subj-${name.replace(/ /g,'_')}" value="${t.subject.replace(/"/g,'&quot;')}"/>
              </div>
              <div class="field-group">
                <label>Body</label>
                <textarea id="body-${name.replace(/ /g,'_')}" rows="10">${t.body}</textarea>
              </div>
            </div>
          `).join("")}
          <button class="btn btn-primary" id="tpl-btn" onclick="saveTemplates(${JSON.stringify(Object.keys(tpl))})">Save Templates</button>
        </div>
      </div>
    `;
  }

  function switchTab(name, btn) {
    document.querySelectorAll(".tpl-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tpl-panel").forEach(p => p.classList.add("hidden"));
    btn.classList.add("active");
    document.getElementById("tpl-" + name.replace(/ /g, "_")).classList.remove("hidden");
  }

  function togglePass(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
    btn.textContent = input.type === "password" ? "Show" : "Hide";
  }

  function showMsg(text, ok) {
    const msg = document.getElementById("msg");
    msg.className = ok ? "alert-success" : "alert";
    msg.textContent = text;
    msg.style.display = "block";
    setTimeout(() => msg.style.display = "none", 3000);
  }

  async function saveCookie() {
    const btn = document.getElementById("cookie-btn");
    btn.textContent = "Saving..."; btn.disabled = true;
    const val = document.getElementById("session_cookie").value;
    if (!val || val.startsWith("•")) {
      showMsg("No changes to save.", false);
      btn.textContent = "Save Cookie"; btn.disabled = false; return;
    }
    const res = await apiFetch("/api/settings", { method: "POST", body: JSON.stringify({ session_cookie: val }) });
    const d = await res.json();
    showMsg(d.ok ? "Cookie saved! Sync will now use it." : "Failed to save.", d.ok);
    btn.textContent = "Save Cookie"; btn.disabled = false;
    if (d.ok) load();
  }

  async function saveCredentials() {
    const btn = document.getElementById("cred-btn");
    btn.textContent = "Saving..."; btn.disabled = true;
    const pp = document.getElementById("portal_password").value;
    const gp = document.getElementById("gmail_app_password").value;
    const payload = {};
    if (pp && !pp.startsWith("•")) payload.portal_password = pp;
    if (gp && !gp.startsWith("•")) payload.gmail_app_password = gp;
    if (!Object.keys(payload).length) {
      btn.textContent = "Save Credentials"; btn.disabled = false;
      showMsg("No changes to save.", false); return;
    }
    const res = await apiFetch("/api/settings", { method: "POST", body: JSON.stringify(payload) });
    const d = await res.json();
    showMsg(d.ok ? "Credentials saved!" : "Failed to save.", d.ok);
    btn.textContent = "Save Credentials"; btn.disabled = false;
    if (d.ok) load();
  }

  async function saveSignature() {
    const btn = document.getElementById("sig-btn");
    btn.textContent = "Saving..."; btn.disabled = true;
    const res = await apiFetch("/api/signature", {
      method: "POST",
      body: JSON.stringify({
        sig_name: document.getElementById("sig_name").value,
        sig_title: document.getElementById("sig_title").value,
        sig_phone: document.getElementById("sig_phone").value,
      })
    });
    const d = await res.json();
    showMsg(d.ok ? "Signature saved!" : "Failed to save.", d.ok);
    btn.textContent = "Save Signature"; btn.disabled = false;
  }

  async function saveTemplates(names) {
    const btn = document.getElementById("tpl-btn");
    btn.textContent = "Saving..."; btn.disabled = true;
    const payload = {};
    for (const name of names) {
      const key = name.replace(/ /g, "_");
      payload[name] = {
        subject: document.getElementById("subj-" + key).value,
        body: document.getElementById("body-" + key).value,
      };
    }
    const res = await apiFetch("/api/templates", { method: "POST", body: JSON.stringify(payload) });
    const d = await res.json();
    showMsg(d.ok ? "Templates saved!" : "Failed to save.", d.ok);
    btn.textContent = "Save Templates"; btn.disabled = false;
  }

  load();
</script>
</body>
</html>
