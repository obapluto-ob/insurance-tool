<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – Dona's Tool</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script>
  requireAuth();
  renderNav("Dashboard");

  let logInterval = null;
  let seenLogs = 0;

  async function load() {
    try {
      const res = await apiFetch("/api/dashboard");
      if (!res.ok) {
        const txt = await res.text();
        console.error("[dashboard] /api/dashboard error:", res.status, txt);
        document.getElementById("page-content").innerHTML = `<div class="empty" style="color:red">Failed to load dashboard (${res.status}). Check console for details.</div>`;
        return;
      }
      const d = await res.json();
      console.log("[dashboard] stats:", d);
      document.getElementById("page-content").innerHTML = `
      <div class="page-header">
        <h1>Dashboard</h1>
        <div class="actions">
          <button class="btn btn-primary" id="sync-btn" onclick="syncPortal(this)">Sync Portal</button>
          <button class="btn btn-secondary" id="manual-sync-btn" onclick="manualSync(this)">Manual Sync</button>
          <button class="btn btn-secondary" id="replies-btn" onclick="checkReplies(this)">Check Replies</button>
          <button class="btn btn-danger" onclick="resetSync()">Reset Sync</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-number">${d.total}</div><div class="stat-label">Total Leads</div></div>
        <div class="stat-card red"><div class="stat-number">${d.no_policy}</div><div class="stat-label">No Policy</div></div>
        <div class="stat-card yellow"><div class="stat-number">${d.pos}</div><div class="stat-label">POS</div></div>
        <div class="stat-card blue"><div class="stat-number">${d.sglw}</div><div class="stat-label">SGLW</div></div>
        <div class="stat-card grey"><div class="stat-number">${d.active || 0}</div><div class="stat-label">Active Policy</div></div>
        <div class="stat-card green"><div class="stat-number">${d.emailed}</div><div class="stat-label">Emails Sent</div></div>
        <div class="stat-card purple"><div class="stat-number">${d.responses}</div><div class="stat-label">Responses</div></div>
      </div>
      <div class="quick-actions">
        <h3>Quick Actions</h3>
        <a href="leads.html?category=NO_POLICY" class="quick-btn">View No Policy Leads</a>
        <a href="responses.html" class="quick-btn">View Responses</a>
      </div>
      <div id="log-panel" class="log-panel" style="display:none">
        <div class="log-header">
          <span id="log-title">Sync Log</span>
          <div style="display:flex;gap:8px">
            <button class="log-cancel" id="cancel-btn" onclick="cancelSync()">Stop Sync</button>
            <button class="log-close" onclick="closeLog()">Close</button>
          </div>
        </div>
        <div id="log-body" class="log-body"></div>
      </div>
    `;
      checkIfSyncRunning();
    } catch (err) {
      console.error("[dashboard] load() crashed:", err);
      const el = document.getElementById("page-content");
      if (el) el.innerHTML = `<div class="empty" style="color:red">Dashboard failed to load. Check browser console (F12).</div>`;
    }
  }

  async function checkIfSyncRunning() {
    try {
      const res = await apiFetch("/api/status");
      const d = await res.json();
      if (d.running || (d.logs && d.logs.length > 0 && d.message !== "Ready.")) {
        // Sync is running or just finished — show the log panel with all existing logs
        openLog("Sync Log — Live Output");
        const logs = d.logs || [];
        logs.forEach(msg => appendLog(msg));
        seenLogs = logs.length;
        if (d.running) {
          const btn = document.getElementById("sync-btn");
          if (btn) { btn.textContent = "Syncing..."; btn.disabled = true; }
          startLogPolling();
        } else {
          appendLog("--- Sync finished. Close this panel when ready. ---");
        }
      }
    } catch {}
  }

  function openLog(title) {
    seenLogs = 0;
    document.getElementById("log-panel").style.display = "flex";
    document.getElementById("log-title").textContent = title;
    document.getElementById("log-body").innerHTML = "";
  }

  function closeLog() {
    document.getElementById("log-panel").style.display = "none";
    clearInterval(logInterval);
    logInterval = null;
    load();
  }

  function appendLog(msg) {
    const body = document.getElementById("log-body");
    if (!body) return;
    const line = document.createElement("div");
    line.className = "log-line" +
      (msg.includes("FAILED") || msg.includes("ERROR") ? " log-warn" :
       msg.includes("saved") || msg.includes("successful") || msg.includes("Done") ? " log-ok" : "");
    line.textContent = msg;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
  }

  function startLogPolling() {
    let doneOnce = false;
    let interval = 3000;
    const MAX_INTERVAL = 30000;

    function schedule() {
      logInterval = setTimeout(async () => {
        if (document.visibilityState === "hidden") { schedule(); return; }
        try {
          const res = await apiFetch("/api/status");
          const d = await res.json();
          const logs = d.logs || [];
          for (let i = seenLogs; i < logs.length; i++) appendLog(logs[i]);
          seenLogs = logs.length;
          const bar = document.getElementById("status-bar");
          if (bar) bar.textContent = d.message;
          if (!d.running && logs.length > 0 && !doneOnce) {
            doneOnce = true;
            clearTimeout(logInterval);
            logInterval = null;
            appendLog("--- Sync finished. Close this panel when ready. ---");
            const btn = document.getElementById("sync-btn");
            if (btn) { btn.textContent = "Sync Portal"; btn.disabled = false; }
            const manualBtn = document.getElementById("manual-sync-btn");
            if (manualBtn) { manualBtn.textContent = "Manual Sync"; manualBtn.disabled = false; }
            const cancelBtn = document.getElementById("cancel-btn");
            if (cancelBtn) cancelBtn.style.display = "none";
            return;
          }
          // backoff: increase interval every poll up to MAX_INTERVAL
          interval = Math.min(interval * 1.3, MAX_INTERVAL);
        } catch {}
        schedule();
      }, interval);
    }
    schedule();
  }

  async function cancelSync() {
    const btn = document.getElementById("cancel-btn");
    if (btn) { btn.textContent = "Stopping..."; btn.disabled = true; }
    await apiFetch("/api/cancel", { method: "POST" });
    appendLog("Stop requested...");
  }

  async function resetSync() {
    if (!confirm("Reset sync? Next sync will re-scrape all leads from scratch.")) return;
    const res = await apiFetch("/api/sync/reset", { method: "POST" });
    const d = await res.json();
    alert(d.message || "Sync reset.");
  }

  async function manualSync(btn) {
    btn.textContent = "Syncing...";
    btn.disabled = true;
    openLog("Manual Sync Log — Live Output");
    appendLog("Connecting to manual portal...");
    const res = await apiFetch("/api/manual-sync", { method: "POST" });
    const d = await res.json();
    if (!d.ok) {
      appendLog("ERROR: " + (d.message || "Failed to start manual sync."));
      btn.textContent = "Manual Sync"; btn.disabled = false; return;
    }
    startLogPolling();
  }

  async function syncPortal(btn) {
    btn.textContent = "Syncing...";
    btn.disabled = true;
    openLog("Sync Log — Live Output");
    appendLog("Connecting to portal...");
    await apiFetch("/api/sync");
    startLogPolling();
  }

  async function checkReplies(btn) {
    btn.textContent = "Checking...";
    btn.disabled = true;
    document.getElementById("status-bar").textContent = "Checking Gmail for replies...";
    await apiFetch("/api/check_replies");
    setTimeout(() => { btn.textContent = "Check Replies"; btn.disabled = false; load(); }, 8000);
  }

  load();
</script>
</body>
</html>
