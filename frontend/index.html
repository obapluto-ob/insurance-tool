<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Dona's Tool</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-logo">🛡️</div>
    <h2>Dona's Insurance Tool</h2>
    <p class="login-sub">Sign in to your account</p>
    <div id="error" class="alert" style="display:none"></div>
    <form id="login-form">
      <input type="text" id="username" placeholder="Username" required autofocus/>
      <input type="password" id="password" placeholder="Password" required/>
      <button type="submit">Sign In</button>
    </form>
  </div>
  <script src="js/config.js"></script>
  <script>
    if (localStorage.getItem("token")) window.location.href = "pages/dashboard.html";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value
        })
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem("token", data.token);
        window.location.href = "pages/dashboard.html";
      } else {
        const err = document.getElementById("error");
        err.textContent = data.error || "Invalid credentials.";
        err.style.display = "block";
      }
    });
  </script>
</body>
</html>
