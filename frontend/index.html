<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dona's Insurance Tool</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-page">

  <!-- Animated background scene -->
  <canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none"></canvas>

  <div class="login-wrap">
    <div class="pulse-ring"></div>
    <div class="pulse-ring delay"></div>
    <div class="pulse-ring delay2"></div>

    <div class="login-card">
      <div class="login-brand">
        <svg class="brand-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Shield -->
          <path d="M24 3 L40 9 L40 24 C40 34 24 44 24 44 C24 44 8 34 8 24 L8 9 Z" fill="#1e2535" stroke="#3b82f6" stroke-width="1.5"/>
          <!-- Adult figure -->
          <circle cx="19" cy="18" r="2.5" fill="#3b82f6" class="fig-head-1"/>
          <line x1="19" y1="20.5" x2="19" y2="27" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="19" y1="22" x2="16" y2="25" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="19" y1="22" x2="22" y2="25" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="19" y1="27" x2="17" y2="31" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="19" y1="27" x2="21" y2="31" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Adult figure 2 -->
          <circle cx="29" cy="18" r="2.5" fill="#60a5fa" class="fig-head-2"/>
          <line x1="29" y1="20.5" x2="29" y2="27" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="29" y1="22" x2="26" y2="25" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="29" y1="22" x2="32" y2="25" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="29" y1="27" x2="27" y2="31" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="29" y1="27" x2="31" y2="31" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Child figure -->
          <circle cx="24" cy="20" r="1.8" fill="#93c5fd"/>
          <line x1="24" y1="21.8" x2="24" y2="26" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="24" y1="23" x2="22" y2="25" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="24" y1="23" x2="26" y2="25" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="24" y1="26" x2="23" y2="29" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="24" y1="26" x2="25" y2="29" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="brand-name">Dona's Tool</div>
          <div class="brand-sub">Insurance Lead Manager</div>
        </div>
      </div>

      <div class="pin-display">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>

      <div id="pin-status" class="pin-status" style="display:none"></div>

      <div class="pin-pad">
        <button class="pin-btn" onclick="pressPin('1')">1</button>
        <button class="pin-btn" onclick="pressPin('2')">2</button>
        <button class="pin-btn" onclick="pressPin('3')">3</button>
        <button class="pin-btn" onclick="pressPin('4')">4</button>
        <button class="pin-btn" onclick="pressPin('5')">5</button>
        <button class="pin-btn" onclick="pressPin('6')">6</button>
        <button class="pin-btn" onclick="pressPin('7')">7</button>
        <button class="pin-btn" onclick="pressPin('8')">8</button>
        <button class="pin-btn" onclick="pressPin('9')">9</button>
        <button class="pin-btn pin-clear" onclick="clearPin()">Clear</button>
        <button class="pin-btn" onclick="pressPin('0')">0</button>
        <button class="pin-btn pin-del" onclick="deletePin()">&#9003;</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    // ── Background canvas animation ──────────────────────────────
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // City skyline buildings
    const buildings = [];
    function initBuildings() {
      buildings.length = 0;
      const count = Math.floor(W / 60);
      for (let i = 0; i < count; i++) {
        buildings.push({
          x: i * (W / count) + Math.random() * 20,
          w: 30 + Math.random() * 40,
          h: 60 + Math.random() * 120,
          windows: Math.floor(Math.random() * 6) + 2
        });
      }
    }
    initBuildings();
    window.addEventListener('resize', initBuildings);

    function drawSkyline() {
      ctx.fillStyle = 'rgba(22,27,39,0.6)';
      for (const b of buildings) {
        const bx = b.x, by = H - b.h, bw = b.w, bh = b.h;
        ctx.fillRect(bx, by, bw, bh);
        // windows
        ctx.fillStyle = 'rgba(59,130,246,0.15)';
        const cols = 2, rows = b.windows;
        const ww = 6, wh = 5, gx = (bw - cols*ww) / (cols+1), gy = 12;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (Math.random() > 0.3) {
              ctx.fillStyle = `rgba(59,130,246,${0.1 + Math.random()*0.25})`;
              ctx.fillRect(bx + gx + c*(ww+gx), by + gy + r*(wh+gy), ww, wh);
            }
          }
        }
        ctx.fillStyle = 'rgba(22,27,39,0.6)';
      }
    }

    // Walking people
    class Person {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = init ? Math.random() * W : -40;
        this.y = H - 30 - Math.random() * 20;
        this.speed = 0.4 + Math.random() * 0.6;
        this.scale = 0.7 + Math.random() * 0.5;
        this.step = Math.random() * Math.PI * 2;
        this.color = ['#3b82f6','#60a5fa','#93c5fd','#2563eb'][Math.floor(Math.random()*4)];
        this.briefcase = Math.random() > 0.5;
      }
      update() {
        this.x += this.speed;
        this.step += 0.08;
        if (this.x > W + 40) this.reset(false);
      }
      draw() {
        const s = this.scale;
        const x = this.x, y = this.y;
        const legSwing = Math.sin(this.step) * 8 * s;
        const armSwing = Math.sin(this.step) * 6 * s;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5 * s;
        ctx.lineCap = 'round';
        // head
        ctx.beginPath();
        ctx.arc(x, y - 22*s, 5*s, 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
        // body
        ctx.beginPath();
        ctx.moveTo(x, y - 17*s);
        ctx.lineTo(x, y - 5*s);
        ctx.stroke();
        // arms
        ctx.beginPath();
        ctx.moveTo(x, y - 14*s);
        ctx.lineTo(x - 7*s + armSwing, y - 7*s);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y - 14*s);
        ctx.lineTo(x + 7*s - armSwing, y - 7*s);
        ctx.stroke();
        // legs
        ctx.beginPath();
        ctx.moveTo(x, y - 5*s);
        ctx.lineTo(x - 5*s + legSwing, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y - 5*s);
        ctx.lineTo(x + 5*s - legSwing, y);
        ctx.stroke();
        // briefcase
        if (this.briefcase) {
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 1 * s;
          ctx.strokeRect(x + 8*s - armSwing, y - 9*s, 7*s, 5*s);
        }
      }
    }

    // Floating symbols — $, %, shield, heart
    class FloatSymbol {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : H + 20;
        this.vy = -(0.2 + Math.random() * 0.4);
        this.vx = (Math.random() - 0.5) * 0.3;
        this.alpha = 0;
        this.fadeIn = true;
        this.size = 10 + Math.random() * 10;
        this.sym = ['$','%','♥','★','$','$'][Math.floor(Math.random()*6)];
        this.color = ['#3b82f6','#22c55e','#f59e0b','#60a5fa'][Math.floor(Math.random()*4)];
      }
      update() {
        this.y += this.vy;
        this.x += this.vx;
        if (this.fadeIn) { this.alpha = Math.min(1, this.alpha + 0.02); if (this.alpha >= 0.4) this.fadeIn = false; }
        else { this.alpha = Math.max(0, this.alpha - 0.005); }
        if (this.alpha <= 0 || this.y < -20) this.reset(false);
      }
      draw() {
        ctx.globalAlpha = this.alpha * 0.5;
        ctx.fillStyle = this.color;
        ctx.font = `${this.size}px Segoe UI`;
        ctx.fillText(this.sym, this.x, this.y);
        ctx.globalAlpha = 1;
      }
    }

    // Grid lines
    function drawGrid() {
      ctx.strokeStyle = 'rgba(59,130,246,0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      }
    }

    // Ground line
    function drawGround() {
      ctx.strokeStyle = 'rgba(59,130,246,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H - 10);
      ctx.lineTo(W, H - 10);
      ctx.stroke();
    }

    const people = Array.from({length: 8}, () => new Person());
    const symbols = Array.from({length: 18}, () => new FloatSymbol());

    function animate() {
      ctx.clearRect(0, 0, W, H);
      drawGrid();
      drawSkyline();
      drawGround();
      symbols.forEach(s => { s.update(); s.draw(); });
      people.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
    // ────────────────────────────────────────────────────────────

    if (localStorage.getItem("token")) window.location.href = "pages/dashboard.html";

    let pin = "";

    function pressPin(digit) {
      if (pin.length >= 4) return;
      pin += digit;
      updateDots();
      if (pin.length === 4) submitPin();
    }

    function deletePin() {
      pin = pin.slice(0, -1);
      updateDots();
    }

    function clearPin() {
      pin = '';
      updateDots();
      showStatus('', '');
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById("d" + i);
        dot.classList.toggle("filled", i < pin.length);
      }
    }

    async function submitPin() {
      // disable pad and show verifying
      setPadDisabled(true);
      showStatus("Verifying...", "verifying");

      try {
        const res = await fetch(`${API}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin })
        });
        const data = await res.json();
        if (data.token) {
          showStatus('✓ Confirmed', 'ok');
          document.querySelector('.login-card').classList.add('state-ok');
          localStorage.setItem('token', data.token);
          setTimeout(() => { window.location.href = 'pages/dashboard.html'; }, 700);
        } else {
          showStatus('✗ Incorrect PIN', 'error');
          document.querySelector('.login-card').classList.add('state-error');
          document.querySelector('.pin-display').classList.add('shake');
          setTimeout(() => {
            document.querySelector('.pin-display').classList.remove('shake');
            document.querySelector('.login-card').classList.remove('state-error');
            showStatus('', '');
            setPadDisabled(false);
            pin = '';
            updateDots();
          }, 1200);
        }
      } catch (err) {
        showStatus('✗ Connection failed', 'error');
        document.querySelector('.login-card').classList.add('state-error');
        setTimeout(() => {
          document.querySelector('.login-card').classList.remove('state-error');
          showStatus('', '');
          setPadDisabled(false);
          pin = '';
          updateDots();
        }, 1500);
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById("pin-status");
      el.textContent = msg;
      el.className = "pin-status" + (type ? " pin-status-" + type : "");
      el.style.display = msg ? "block" : "none";
    }

    function setPadDisabled(disabled) {
      document.querySelectorAll(".pin-btn").forEach(b => b.disabled = disabled);
    }

    // keyboard support
    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") pressPin(e.key);
      if (e.key === "Backspace") deletePin();
      if (e.key === "Escape") clearPin();
    });
  </script>
</body>
</html>
